<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonateUZ - Offline</title>
  <style>
    /* Fully self-contained: no external fonts, scripts, or styles —
       this page must render with no internet connection at all. */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0F4C77 0%, #15577F 55%, #0F9E96 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card { text-align: center; color: #fff; padding: 24px; }
    .card h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.5rem; font-weight: 800; margin: 16px 0 0; }
    .card p { font-size: .875rem; opacity: .9; margin: 8px 0 24px; }
    .card svg { width: 48px; height: 48px; stroke: #fff; }
    .card button {
      background: #fff; color: #15577F; border: 0; padding: 10px 28px;
      border-radius: 999px; font-weight: 700; font-size: .9rem; cursor: pointer;
    }
    .card button:hover { background: #F2F9FF; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(135deg, #08161C 0%, #0F2530 100%); }
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="2" y1="2" x2="22" y2="22"/>

    <p>Some parts of DonateUZ may not work until your connection returns.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
